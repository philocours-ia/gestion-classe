<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Gestion Terminale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white">
  <div class="flex">
    <!-- Sidebar -->
    <div class="w-64 bg-zinc-900 min-h-screen p-6 flex flex-col">
      <h2 class="text-2xl font-bold mb-8">Gestion Terminale</h2>
      <nav class="space-y-1 flex-1">
        <a href="#" onclick="showSection('eleves')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-zinc-800"><i class="fa-solid fa-users w-5"></i> Liste des élèves</a>
        <a href="#" onclick="showSection('appel')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-zinc-800"><i class="fa-solid fa-clipboard-check w-5"></i> Registre d'appel</a>
        <a href="#" onclick="showSection('rapports')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-zinc-800"><i class="fa-solid fa-chart-bar w-5"></i> Rapports journaliers</a>
        <a href="#" onclick="showSection('notes')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-zinc-800"><i class="fa-solid fa-graduation-cap w-5"></i> Feuille de notes</a>
        <a href="#" onclick="showSection('bulletins')" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-zinc-800"><i class="fa-solid fa-file-lines w-5"></i> Générateur de bulletins</a>
      </nav>
      <div class="mt-auto pt-8">
        <a href="login.html" class="text-sm text-zinc-400 hover:text-white flex items-center gap-2"><i class="fa-solid fa-sign-out-alt"></i> Déconnexion</a>
      </div>
    </div>

    <!-- Contenu principal -->
    <div class="flex-1 p-8">
      <!-- Section Élèves -->
      <div id="eleves" class="section">
        <h1 class="text-3xl font-bold mb-6">Liste des élèves</h1>
        <div class="bg-zinc-900 p-6 rounded-3xl">
          <div class="flex gap-3 mb-6">
            <input id="nom" placeholder="Nom" class="flex-1 bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3">
            <input id="prenom" placeholder="Prénom" class="flex-1 bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3">
            <input id="numero" placeholder="Numéro" class="flex-1 bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3">
            <button onclick="ajouterEleve()" class="bg-emerald-600 hover:bg-emerald-700 px-6 rounded-2xl transition-colors">Ajouter</button>
          </div>
          <table class="w-full">
            <thead><tr class="text-left text-zinc-400"><th class="pb-3">Nom</th><th>Prénom</th><th>Numéro</th><th></th></tr></thead>
            <tbody id="liste-eleves"></tbody>
          </table>
        </div>
      </div>

      <!-- Registre d'appel -->
      <div id="appel" class="section hidden">
        <h1 class="text-3xl font-bold mb-6">Registre d'appel</h1>
        <div class="bg-zinc-900 p-6 rounded-3xl">
          <input type="date" id="date-appel" class="mb-4 bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2">
          <div id="appel-liste"></div>
          <button onclick="sauvegarderAppel()" class="mt-4 bg-emerald-600 hover:bg-emerald-700 px-6 py-3 rounded-2xl transition-colors">Enregistrer l'appel</button>
        </div>
      </div>

      <!-- Rapports journaliers -->
      <div id="rapports" class="section hidden">
        <h1 class="text-3xl font-bold mb-6">Rapports journaliers (Retards & Absences)</h1>
        <div id="rapport-contenu" class="bg-zinc-900 p-6 rounded-3xl"></div>
      </div>

      <!-- Feuille de notes -->
      <div id="notes" class="section hidden">
        <h1 class="text-3xl font-bold mb-6">Feuille de notes</h1>
        <div class="bg-zinc-900 p-6 rounded-3xl">
          <div id="notes-table"></div>
        </div>
      </div>

      <!-- Générateur de bulletins -->
      <div id="bulletins" class="section hidden">
        <h1 class="text-3xl font-bold mb-6">Générateur de bulletins</h1>
        <div class="bg-zinc-900 p-6 rounded-3xl">
          <div class="flex gap-3 mb-6">
            <input id="nom-bulletin" placeholder="Nom de l'élève" class="flex-1 bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3">
            <button onclick="genererBulletin()" class="bg-emerald-600 hover:bg-emerald-700 px-8 rounded-2xl transition-colors">Générer</button>
          </div>
          <div id="bulletin-result"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // === DONNÉES ===
    let eleves = JSON.parse(localStorage.getItem('eleves')) || [];
    let appels = JSON.parse(localStorage.getItem('appels')) || {};
    let notes = JSON.parse(localStorage.getItem('notes')) || {};

    const matieres = ['Philosophie','Mathématiques','Malagasy','Français','Anglais','EPS','Physiques','SVT','Histo-Géo'];

    function sauvegarder() {
      localStorage.setItem('eleves', JSON.stringify(eleves));
      localStorage.setItem('appels', JSON.stringify(appels));
      localStorage.setItem('notes', JSON.stringify(notes));
    }

    // === Navigation entre sections ===
    function showSection(sectionId) {
      document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
      document.getElementById(sectionId).classList.remove('hidden');

      if (sectionId === 'eleves') afficherEleves();
      if (sectionId === 'appel') afficherAppel();
      if (sectionId === 'rapports') afficherRapports();
      if (sectionId === 'notes') afficherNotes();
    }

    // === Élèves ===
    function afficherEleves() {
      const tbody = document.getElementById('liste-eleves');
      tbody.innerHTML = '';
      eleves.forEach((eleve, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="py-2">${eleve.nom}</td>
          <td>${eleve.prenom}</td>
          <td>${eleve.numero}</td>
          <td><button onclick="supprimerEleve(${index})" class="text-red-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function ajouterEleve() {
      const nom = document.getElementById('nom').value.trim();
      const prenom = document.getElementById('prenom').value.trim();
      const numero = document.getElementById('numero').value.trim();

      if (!nom || !prenom || !numero) {
        alert("Veuillez remplir tous les champs !");
        return;
      }

      eleves.push({ nom, prenom, numero });
      sauvegarder();
      afficherEleves();

      // Vider les champs
      document.getElementById('nom').value = '';
      document.getElementById('prenom').value = '';
      document.getElementById('numero').value = '';
    }

    function supprimerEleve(index) {
      if (confirm("Supprimer cet élève ?")) {
        eleves.splice(index, 1);
        sauvegarder();
        afficherEleves();
      }
    }

    // === Registre d'appel ===
    function afficherAppel() {
      const container = document.getElementById('appel-liste');
      container.innerHTML = '';

      if (eleves.length === 0) {
        container.innerHTML = '<p class="text-zinc-400">Aucun élève enregistré.</p>';
        return;
      }

      eleves.forEach((eleve, index) => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between py-2 border-b border-zinc-700';
        div.innerHTML = `
          <span>${eleve.prenom} ${eleve.nom}</span>
          <div class="flex gap-4">
            <label class="flex items-center gap-1"><input type="radio" name="presence-${index}" value="present" checked> Présent</label>
            <label class="flex items-center gap-1"><input type="radio" name="presence-${index}" value="retard"> Retard</label>
            <label class="flex items-center gap-1"><input type="radio" name="presence-${index}" value="absent"> Absent</label>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function sauvegarderAppel() {
      const date = document.getElementById('date-appel').value || new Date().toISOString().split('T')[0];
      const presence = {};

      eleves.forEach((_, index) => {
        const radios = document.querySelectorAll(`input[name="presence-${index}"]`);
        radios.forEach(radio => {
          if (radio.checked) presence[index] = radio.value;
        });
      });

      appels[date] = presence;
      sauvegarder();
      alert("Appel enregistré !");
      afficherRapports();
    }

    // === Rapports journaliers ===
    function afficherRapports() {
      const container = document.getElementById('rapport-contenu');
      container.innerHTML = '';

      const dates = Object.keys(appels).sort().reverse();

      if (dates.length === 0) {
        container.innerHTML = '<p class="text-zinc-400">Aucun appel enregistré.</p>';
        return;
      }

      dates.forEach(date => {
        const data = appels[date];
        let html = `<div class="mb-6"><h3 class="font-semibold mb-2">${date}</h3><ul class="space-y-1">`;

        eleves.forEach((eleve, index) => {
          const status = data[index] || 'present';
          const color = status === 'absent' ? 'text-red-400' : status === 'retard' ? 'text-amber-400' : 'text-emerald-400';
          html += `<li>${eleve.prenom} ${eleve.nom} — <span class="${color}">${status}</span></li>`;
        });

        html += `</ul></div>`;
        container.innerHTML += html;
      });
    }

    // === Feuille de notes ===
    function afficherNotes() {
      const container = document.getElementById('notes-table');
      container.innerHTML = '';

      if (eleves.length === 0) {
        container.innerHTML = '<p class="text-zinc-400">Aucun élève.</p>';
        return;
      }

      let html = `<table class="w-full text-sm"><thead><tr class="text-zinc-400"><th class="text-left pb-2">Élève</th>`;
      matieres.forEach(m => html += `<th class="pb-2">${m}</th>`);
      html += `</tr></thead><tbody>`;

      eleves.forEach((eleve, index) => {
        html += `<tr><td class="py-2">${eleve.prenom} ${eleve.nom}</td>`;
        matieres.forEach(matiere => {
          const note = notes[`${index}-${matiere}`] || '';
          html += `<td><input type="number" step="0.5" min="0" max="20" value="${note}" 
            onchange="sauvegarderNote(${index}, '${matiere}', this.value)" 
            class="w-16 bg-zinc-800 border border-zinc-700 rounded-xl px-2 py-1 text-center"></td>`;
        });
        html += `</tr>`;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    function sauvegarderNote(eleveIndex, matiere, valeur) {
      notes[`${eleveIndex}-${matiere}`] = parseFloat(valeur) || '';
      sauvegarder();
    }

    // === Générateur de bulletins ===
    function genererBulletin() {
      const nomRecherche = document.getElementById('nom-bulletin').value.trim().toLowerCase();
      const result = document.getElementById('bulletin-result');

      const eleve = eleves.find(e => 
        `${e.prenom} ${e.nom}`.toLowerCase().includes(nomRecherche) || 
        e.nom.toLowerCase().includes(nomRecherche)
      );

      if (!eleve) {
        result.innerHTML = `<p class="text-red-400">Élève non trouvé.</p>`;
        return;
      }

      let html = `<div class="bg-zinc-800 p-6 rounded-2xl"><h3 class="text-xl font-semibold mb-4">Bulletin de ${eleve.prenom} ${eleve.nom}</h3><table class="w-full"><thead><tr><th>Matière</th><th>Note</th></tr></thead><tbody>`;

      let total = 0, count = 0;
      matieres.forEach(m => {
        const note = notes[`${eleves.indexOf(eleve)}-${m}`] || 0;
        html += `<tr><td>${m}</td><td>${note || '-'}</td></tr>`;
        if (note) { total += note; count++; }
      });

      const moyenne = count > 0 ? (total / count).toFixed(2) : '-';
      html += `</tbody></table><p class="mt-4 font-semibold">Moyenne générale : ${moyenne}</p></div>`;

      result.innerHTML = html;
    }

    // === Initialisation ===
    window.onload = function() {
      document.getElementById('eleves').classList.remove('hidden');
      afficherEleves();
    }
  </script>
</body>
</html>
