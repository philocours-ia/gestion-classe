<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Gestion Terminale</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white flex items-center justify-center min-h-screen">
  <div class="max-w-md w-full p-8">
    <h1 class="text-4xl font-bold text-center mb-2">Gestion Terminale</h1>
    <p class="text-center text-zinc-400 mb-8">Classe Terminale A</p>
    
    <div class="bg-zinc-900 p-8 rounded-3xl">
      <form id="login-form">
        <div class="mb-6">
          <label class="block text-sm mb-2">Code d'accès</label>
          <input type="password" id="code" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-center text-2xl tracking-[8px]" placeholder="••••••" required>
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 py-4 rounded-2xl font-semibold">Se connecter</button>
      </form>
      <p class="text-center text-xs text-zinc-500 mt-4">Code : 210917</p>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const code = document.getElementById('code').value;
      if (code === '210917') {
        window.location.href = 'dashboard.html';
      } else {
        alert('Code incorrect');
      }
    });
  </script>
</body>
</html>
